[package]
name = "amp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AMP matchmaker: fast off-chain queue + Glicko-2 ratings + EIP-712 outcome attestations, settling to Avalanche."

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "migrate",
    "macros",
] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
alloy-primitives = "1"
alloy-signer = "2"
alloy-signer-local = "2"
alloy-provider = { version = "2", features = ["reqwest"] }
alloy-contract = "2"
alloy-sol-types = "1"
sha2 = "0.10"
amp-match-core = { path = "../amp-match-core" }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
dashmap = "6"
hex = "0.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]

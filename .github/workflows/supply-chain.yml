name: AMP Supply Chain

on:
  push:
    branches: [main, tournament-pivot]
  pull_request:
    branches: [main]
jobs:
  cargo-deny:
    name: cargo-deny (advisories + licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
1        with:
          arguments: --workspace check advisories licenses

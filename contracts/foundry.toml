[profile.default]
src = "src"
out = "out"
test = "test"
libs = ["lib"]
evm_version = "cancun" # Required for Avalanche
via_ir = true
optimizer = true
optimizer_runs = 64 # balance: keeps runtime under the 24KB limit without the runs=1 CSE hazards
bytecode_hash = "none"
cbor_metadata = false

# Phase 1.7 — coverage profile for the `forge coverage` gate (≥90% target).
[profile.coverage]
src = "src"
test = "test"
libs = ["lib"]
evm_version = "cancun"
via_ir = true
ffi = true

[rpc_endpoints]
avalanche = "https://api.avax.network/ext/bc/C/rpc"
fuji = "https://api.avax-test.network/ext/bc/C/rpc"


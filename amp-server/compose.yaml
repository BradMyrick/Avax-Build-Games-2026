# AMP matchmaker — self-contained stack: Postgres + amp-server (+ optional Caddy TLS).
#
# Deploy (from the repo root on the host):
#   cp amp-server/.env.compose.example amp-server/.env   # fill secrets
#   docker compose -f amp-server/compose.yaml --env-file amp-server/.env up -d --build
#
# The stack exposes amp-server on :8080. For browser HTTPS sites the
# matchmaker MUST be served over TLS (mixed content blocks http/wss), so put
# your existing reverse proxy in front, or enable the caddy service below
# after pointing a DNS A record at this host.

services:
  amp-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: amp
      POSTGRES_PASSWORD: ${AMP_DB_PASSWORD:?set AMP_DB_PASSWORD}
      POSTGRES_DB: amp
    volumes:
      - amp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amp -d amp"]
      interval: 5s
      timeout: 3s
      retries: 20

  amp-server:
    build:
      context: ..
      dockerfile: amp-server/Dockerfile
    restart: unless-stopped
    depends_on:
      amp-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://amp:${AMP_DB_PASSWORD}@amp-db:5432/amp
      AMP_BIND: 0.0.0.0:8080
      # Attestation signer (generate: openssl rand -hex 32). OPTIONAL —
      # without it the server runs in free-play mode (no attestations).
      AMP_VERIFIER_KEY: ${AMP_VERIFIER_KEY:-}
      # v1 Fuji contracts (attestations verify on-chain once the game's
      # verifier list includes AMP_VERIFIER_ADDRESS).
      AMP_SETTLEMENT_ADDRESS: ${AMP_SETTLEMENT_ADDRESS:-}
      AMP_REGISTRY_ADDRESS: ${AMP_REGISTRY_ADDRESS:-}
      # Arbitration API token. Generate: openssl rand -hex 24
      AMP_ADMIN_TOKEN: ${AMP_ADMIN_TOKEN:-}
      AMP_CORS_ORIGINS: ${AMP_CORS_ORIGINS:-*}
      RUST_LOG: info
    ports:
      - "8080:8080"

  # Optional TLS terminator. Uncomment once DNS points at this host, e.g.
  # amp.playwithamp.xyz → this machine's public IPv4.
  #
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   depends_on: [amp-server]
  #   ports: ["80:80", "443:443"]
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - amp-caddydata:/data
  #     - amp-caddyconfig:/config

volumes:
  amp-pgdata:
  # amp-caddydata:
  # amp-caddyconfig:
